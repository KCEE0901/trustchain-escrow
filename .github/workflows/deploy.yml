name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  # Validate that main and develop stay in parity and that a rollback target
  # exists before any deployment proceeds. Runs on both branches so the same
  # guarantees apply regardless of which branch triggered the workflow.
  rollback-validation:
    name: Rollback Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch parity (main vs develop)
        run: |
          set -euo pipefail
          git fetch origin main develop --quiet || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && \
             git rev-parse --verify origin/develop >/dev/null 2>&1; then
            behind=$(git rev-list --count origin/main..origin/develop)
            echo "develop is ${behind} commit(s) ahead of main"
            if [ "${behind}" -gt 0 ]; then
              echo "::warning::develop is ahead of main by ${behind} commit(s); review parity before release"
            fi
          else
            echo "::warning::main or develop ref not available; skipping parity comparison"
          fi

      - name: Validate rollback target exists
        run: |
          set -euo pipefail
          # A rollback target is the previous successful deployment commit.
          # Fail deterministically if there is no prior commit to roll back to.
          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "::error::No rollback target available (no previous commit)"
            exit 1
          fi
          target=$(git rev-parse --short HEAD~1)
          echo "Rollback target resolved: ${target}"

      - name: Simulate rollback and verify health
        run: |
          set -euo pipefail
          # Deterministic, secret-free simulation of the rollback path.
          # Exercises the primary success path plus two failure boundaries.
          simulate_rollback() {
            local target="$1"
            local health="$2"
            if [ -z "${target}" ]; then
              echo "rollback: missing target"
              return 1
            fi
            if [ "${health}" != "healthy" ]; then
              echo "rollback: health check failed (${health})"
              return 2
            fi
            echo "rollback: success to ${target}"
            return 0
          }

          # Primary success path
          simulate_rollback "$(git rev-parse --short HEAD~1)" "healthy"
          echo "PASS: primary rollback success path"

          # Failure path 1: missing rollback target
          if simulate_rollback "" "healthy"; then
            echo "::error::Expected missing-target rollback to fail"
            exit 1
          fi
          echo "PASS: missing rollback target rejected"

          # Failure path 2: health check failure after rollback
          if simulate_rollback "$(git rev-parse --short HEAD~1)" "unhealthy"; then
            echo "::error::Expected unhealthy rollback to fail"
            exit 1
          fi
          echo "PASS: unhealthy rollback rejected"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: rollback-validation
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Block the deploy if any required secret is missing, weak, or a placeholder.
      - name: Validate environment secrets
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          MFA_JWT_SECRET: ${{ secrets.MFA_JWT_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: node scripts/check-env.js
      - name: Deploying to Staging
        run: |
          echo "Deploying to Staging environment..."
          # Insert actual deployment commands here (e.g., SSH, Cloud provider CLI)
          echo "Successfully deployed to Staging"

      - name: Slack Notification Success
        if: ${{ success() && env.SLACK_WEBHOOK != '' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: good
          SLACK_MESSAGE: 'Staging Deployment: success'

      - name: Slack Notification Failure
        if: ${{ failure() && env.SLACK_WEBHOOK != '' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: danger
          SLACK_MESSAGE: 'Staging Deployment: failure'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://stellar-trust-escrow.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploying to Production
        run: |
          echo "Deploying to Production environment..."
          # Insert actual deployment commands here
          echo "Successfully deployed to Production"

      - name: Slack Notification Success
        if: ${{ success() && env.SLACK_WEBHOOK != '' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: good
          SLACK_MESSAGE: 'Production Deployment: success'

      - name: Slack Notification Failure
        if: ${{ failure() && env.SLACK_WEBHOOK != '' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: danger
          SLACK_MESSAGE: 'Production Deployment: failure'
